<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SIVT AI - Sistem Informasi Virtual TEGALREJO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
</head>
<body>

<!-- ==================== CHAT PAGE (WARGA) ==================== -->
<div id="chatPage">
  <div class="chat-header">
    <div class="logo-icon" id="logoIcon">S</div>
    <div class="header-text">
      <h1 id="headerTitle">SIVT AI</h1>
      <div class="tagline" id="headerTagline">Sistem Informasi Virtual TEGALREJO</div>
    </div>
    <div class="header-actions">
      <button onclick="resetChat()" title="Reset Chat">
        <i class="fas fa-undo-alt"></i>
      </button>
    </div>
  </div>

  <div class="chat-box" id="chatBox"></div>

  <div class="quick-buttons" id="quickButtons"></div>

  <form class="chat-input-area" id="chatForm"
        onsubmit="event.preventDefault(); sendMessage();">
    <textarea id="chatInput" placeholder="Ketik pertanyaan Anda..."
              autocomplete="off" autocorrect="off" autocapitalize="off"
              spellcheck="false" name="chat_message" rows="1"></textarea>
    <button type="submit"><i class="fas fa-paper-plane"></i></button>
  </form>
</div>

<!-- ==================== MODAL SURVEI KEPUASAN ==================== -->
<div class="survey-overlay" id="surveyOverlay">
  <div class="survey-card">
    <div class="survey-icon">
      <i class="fas fa-clipboard-check"></i>
    </div>
    <h2 class="survey-title">Apakah Pertanyaan Anda Sudah Terjawab?</h2>
    <p class="survey-desc">
      Bantu kami meningkatkan kualitas layanan SIVTY AI dengan mengisi survei singkat.
      Hanya butuh 1 menit!
    </p>
    <div class="survey-actions">
      <button class="survey-btn survey-btn-primary" onclick="openSurvey()">
        <i class="fas fa-check-circle"></i> Ya, Isi Survei
      </button>
      <button class="survey-btn survey-btn-secondary" onclick="closeSurvey()">
        <i class="fas fa-comment-dots"></i> Belum, Mau Tanya Lagi
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/script.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('[PWA] SW terdaftar:', reg.scope))
      .catch(err => console.warn('[PWA] Gagal:', err));
  });
}
</script>
</body>
</html>
